name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: lint + build + test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    env:
      # Run the exact pnpm installed below instead of self-switching to the
      # packageManager pin mid-run (pnpm >= 10 hops versions by default).
      # Required on the Node 20 leg; harmless everywhere else.
      npm_config_manage_package_manager_versions: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          # pnpm 11 requires Node >= 22.13 and aborts on Node 20, so that leg
          # pins pnpm 10 — same lockfileVersion 9.0 lockfile, Node >= 18.12.
          # The runtime still claims Node >= 20 (package.json engines).
          - node-version: 20.x
            pnpm-version: "10"
          - node-version: 22.x
            pnpm-version: "11.24.0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build (tsup + api-extractor baseline check)
        run: pnpm build
      - name: Test
        run: pnpm test

  zod-compat:
    name: zod ${{ matrix.zod-version }} compatibility (Node 22)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zod-version: ['3.22.0', '3.24.0']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pin zod ^${{ matrix.zod-version }}
        run: pnpm add -D zod@^${{ matrix.zod-version }}
      # api-extractor is intentionally skipped on this leg: DTS inference can
      # drift across zod minors; the frozen baseline is validated on the
      # default-matrix verify leg above.
      - name: Test
        run: pnpm test

  package-verify:
    name: tarball consumer verification (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build (tsup + api-extractor baseline check)
        run: pnpm build
      - name: Test
        run: pnpm test
      # Protects the npm contract: pack -> install into a fresh consumer ->
      # strict-compile all examples against the tarball (README quickstart
      # included) -> run the offline example -> import-smoke every subpath.
      - name: Verify packed artifact
        run: pnpm verify:package
